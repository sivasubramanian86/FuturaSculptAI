server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers (SAIF / OWASP Top 10)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;

    # Proxy API requests to backend API
    location /api/ {
        set $backend_api "https://futurasculpt-api-eah62ip3iq-as.a.run.app";
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host futurasculpt-api-eah62ip3iq-as.a.run.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy health check
    location /health/ {
        set $backend_health "https://futurasculpt-api-eah62ip3iq-as.a.run.app";
        proxy_pass $backend_health;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host futurasculpt-api-eah62ip3iq-as.a.run.app;
    }

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check for web container itself
    location /web-health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }
}

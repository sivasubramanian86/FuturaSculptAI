name: FuturaSculptAI CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Python 3.12, Ruff, Bandit, Pytest 100% Cov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Enforce Polyglot Standards with Ruff Linter
        run: python -m ruff check --fix app tests

      - name: AST Security Scan with Bandit (SAIF Standard)
        run: python -m bandit -r app

      - name: Run Pytest with 100% Statement & Branch Coverage Gate
        run: python -m pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=100

  frontend-quality-gate:
    name: Frontend Quality Gate (Node 22, TypeScript, Vitest 100% Cov, Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest with 100% Coverage Gate (v8 Provider)
        run: npm run test:coverage

      - name: TypeScript Compile & Vite Production Bundle Build
        run: npm run build

  container-build-verification:
    name: Multi-Stage Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: futurasculpt-api:test

      - name: Build Web Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: futurasculpt-web:test

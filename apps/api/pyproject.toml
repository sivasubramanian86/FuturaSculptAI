[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "futurasculpt-api"
version = "0.1.0"
description = "FuturaSculptAI Work Transformation Operating System Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "networkx>=3.4.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "bandit>=1.8.0",
    "mypy>=1.13.0",
]

[tool.poetry]
name = "futurasculpt-api"
version = "0.1.0"
description = "FuturaSculptAI Work Transformation Operating System Backend API"
authors = ["FuturaSculptAI Contributors <kailasamsiva@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.6.0"
httpx = ">=0.28.0"
networkx = ">=3.4.0"
python-multipart = ">=0.0.18"
sse-starlette = ">=2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-cov = ">=6.0.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.8.0"
bandit = ">=1.8.0"
mypy = ">=1.13.0"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "bandit>=1.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Isolated unit tests for models, deterministic scoring calculators, and policy rules.",
    "integration: Subsystem integration tests for routers, database ledgers, adapters, and prompt orchestrators.",
    "e2e: End-to-end full lifecycle tests and multi-agent deliberation workflows.",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "B", "S"]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "E501", # Line too long (handled by formatting)
    "S101", # Use of assert in tests
    "B008", # FastAPI Depends/Form/File in function defaults
    "I001", # Import block is un-sorted or un-formatted (prevent cross-runner drift)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

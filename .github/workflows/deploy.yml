name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'genai-apac-2026-491004' }}
  REGION: asia-southeast1
  GAR_REPO: futurasculpt-containers

jobs:
  deploy:
    name: Build, Publish to Artifact Registry & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Backend API Container
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/api:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/api:latest"
          docker build -t "${IMAGE_TAG}" -t "${LATEST_TAG}" ./apps/api
          docker push "${IMAGE_TAG}"
          docker push "${LATEST_TAG}"

      - name: Deploy Backend API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: futurasculpt-api
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/api:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --set-env-vars=GCP_PROJECT_ID=${{ env.PROJECT_ID }},ENVIRONMENT=${{ inputs.environment || 'production' }},VERTEX_AI_LOCATION=${{ env.REGION }}

      - name: Build and Push Frontend Cockpit Container
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/web:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/web:latest"
          docker build -t "${IMAGE_TAG}" -t "${LATEST_TAG}" ./apps/web
          docker push "${IMAGE_TAG}"
          docker push "${LATEST_TAG}"

      - name: Deploy Frontend Cockpit to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: futurasculpt-web
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/web:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=5

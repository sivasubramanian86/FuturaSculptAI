services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: futurasculpt-api
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - GCP_PROJECT_ID=genai-apac-2026-491004
      - VERTEX_AI_LOCATION=asia-southeast1
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: futurasculpt-web
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/web-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
